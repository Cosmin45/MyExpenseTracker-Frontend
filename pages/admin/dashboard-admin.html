<html>
    <head>
        <link rel="stylesheet" href="/css/style.css">
        <title>Dashboard</title>
    </head>
    <body>
        <header class="navbar">
            <div class="dashboard-logo-container">
                <img src="/images/application-logo.png" alt="app-logo">
                <p>MyExpenseTracker</p>
            </div>
            <div class="dashboard-buttons-container">
                <button id="dashboard-button" class="dashboard-type-button">Dashboard</button>
                <button id="users-button" class="dashboard-type-button active">Users</button>
                <button id="audit-button" class="dashboard-type-button">Audit</button>
                <button id="unexpected-errors-button" class="dashboard-type-button">Unexpected Errors</button>
            </div>
            <div class="dashboard-user-profile-container">
                <p></p>
                <img src="/images/user.png" alt="user-img">
            </div>
        </header>
        <div id="dashboard-main-container">
            <div id="dashboard-container" class="main-container">
                <div id="dashboard-cards-container">
                    <div id="card-first-container" class="card">
                        <p>Total Users</p>
                        <p id="card-one-value">0.0</p>
                    </div>
                    <div id="card-second-container" class="card">
                        <p>Total Admins</p>
                        <p id="card-second-value">0.0</p>
                    </div>
                    <div id="card-third-container" class="card">
                        <p>Total Payments</p>
                        <p id="card-third-value">0.0</p>
                    </div>
                    <div id="card-forth-container" class="card">
                        <p>Enabled Users</p>
                        <p id="card-forth-value">0.0</p>
                    </div>
                </div>
                <div id="dashboard-first-two-charts-container">
                    <div id="dashboard--container" class="expenses-and-incomes-by-month-container">
                        <canvas></canvas>
                    </div>
                    <div class="savings-by-month-container">
                        <canvas></canvas>
                    </div>
                </div>
            </div>
            <div id="users-container" class="main-container">
                <div id="users-filters-and-sort">
                    <select name="" id="users-select-by-role">
                        <option value="all" selected>All Roles</option>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                    <select name="" id="users-select-by-status">
                        <option value="all" selected>All Status</option>
                        <option value="enabled">Enabled</option>
                        <option value="disabled">Disabled</option>
                    </select>
                    <select name="" id="users-select-by-email-type">
                        <option value="all" selected>All emails</option>
                        <option value="verified">Verified</option>
                        <option value="unverified">Unverified</option>
                    </select>
                    <select name="" id="users-select-by-mfa">
                        <option value="all" selected>All MFA</option>
                        <option value="mfa-on">MFA On</option>
                        <option value="mfa-off">MFA Off</option>
                    </select>
                    <select name="" id="users-select-by-alerts">
                        <option value="all" selected>Ignore alerts</option>
                        <option value="alerts-on">Alerts On</option>
                        <option value="alerts-off">Alerts Off</option>
                    </select>
                    <select name="" id="users-select-sort-by">
                        <option value="id-asc" selected>Id ASC</option>
                        <option value="id-desc">Id DESC</option>
                        <option value="username-asc">Username ASC</option>
                        <option value="username-desc">Username DESC</option>
                        <option value="fullname-asc">Fullname ASC</option>
                        <option value="fullname-desc">Fullname DESC</option>
                        <option value="email-asc">Email ASC</option>
                        <option value="email-desc">Email DESC</option>
                        <option value="created-at-asc">Created at ASC</option>
                        <option value="created-at-desc">Created at DESC</option>
                        <option value="role">Role</option>
                        <option value="status">Status</option>
                        <option value="email-verified">Email verified</option>
                        <option value="requires-mfa">Requires MFA</option>
                        <option value="budget-goal-asc">Budget goal ASC</option>
                        <option value="budget-goal-desc">Budget goal DESC</option>
                        <option value="savings-goal-asc">Savings goal ASC</option>
                        <option value="savings-goal-desc">Savings goal DESC</option>
                        <option value="allows-alerts">Allows alerts</option>
                    </select>
                </div>
                <div id="users-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Username</th>
                                <th>Fullname</th>
                                <th>Email</th>
                                <th>Created at</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Email verified</th>
                                <th>Requires MFA</th>
                                <th>Budget goal</th>
                                <th>Savings goal</th>
                                <th>Allows alerts</th>
                                <th>Delete user</th>
                            </tr>
                        </thead>

                </div>
                
            </div>
            <div id="audit-container" class="main-container">
                <p>Audit</p>
            </div>
