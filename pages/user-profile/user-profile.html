<html>
    <head>
        <link rel="stylesheet" href="/css/style.css">
        <title>User Profile</title>
    </head>
    <body>
        <div id="user-profile-main-container">
            <div id="top-bar-container">
                <div id="top-bar-left-container">
                    <img src="/images/user-profile-images/back.png" alt="back-img">
                    <p>Back</p>
                </div>
                <p>User Profile</p>
                <div id="top-bar-right-container">
                    <p>Log out</p>
                    <img src="/images/user-profile-images/log-out.png" alt="">
                </div>
            </div>
            <div id="image-container">
                    <img id="user-image" src="/images/user-profile-images/user-profile.png" alt="User-image">
                    <input type="file" id="image-input" accept="image/*" onchange="previewImage(event)" hidden>
                    <button onclick="document.getElementById('image-input').click()">Change photo</button>
            </div>
            <div id="user-informations-container">
                <div id="user-email-container" class="user-information">
                    <div class="logo-and-info">
                        <img src="/images/user-profile-images/email.png" alt="email-logo">
                        <label>Email</label>
                    </div>
                    <p>user.email@test.com</p>
                    <button onclick="goToEditPage('email')">Edit</button>
                </div>
                <div id="user-fullname-container" class="user-information">
                    <div class="logo-and-info">
                        <img src="/images/user-profile-images/fullname.png" alt="fullname-logo">
                        <label>Full Name</label>
                    </div>
                    <p>Full Name</p>
                    <button onclick="goToEditPage('fullname')">Edit</button>
                </div>
                <div id="user-username-container" class="user-information">
                    <div class="logo-and-info">
                        <img src="/images/user-profile-images/username.png" alt="username-logo">
                        <label>Username</label>
                    </div>
                    <p>Username</p>
                    <button onclick="goToEditPage('username')">Edit</button>
                </div>
                <div id="user-password-container" class="user-information">
                    <div class="logo-and-info">
                        <img src="/images/user-profile-images/password.png" alt="password-logo">
                        <label>Password</label>
                    </div>
                    <p>**********</p>
                    <button onclick="goToEditPage('password')">Edit</button>
                </div>
            </div>

            <div id="user-profile-settings-container">
                <div id="user-profile-mfa-container" class="user-information">
                    <div class="logo-and-info">
                        <img src="/images/user-profile-images/mfa-2.png" alt="mfa-logo">
                        <label>Multi-Factor Authentication</label>
                    </div>
                    <div id="mfa-on-off-buttons-container">
                        <button id="mfa-on-button" class="type-button">On</button>
                        <button id="mfa-off-button" class="type-button">Off</button>
                    </div>
                </div>

                <div id="user-profile-alerts-container" class="user-information">
                    <div class="logo-and-info">
                        <img src="/images/user-profile-images/alert.png" alt="alert-logo">
                        <label>Allows alerts via email</label>
                    </div>
                    <div id="alert-on-off-buttons-container">
                        <button id="alert-on-button" class="type-button">On</button>
                        <button id="alert-off-button" class="type-button">Off</button>
                    </div>
                </div>

                <div id="user-profile-logout-all-container" class="user-information">
                    <div class="logo-and-info">
                        <img src="/images/user-profile-images/log-out-all.png" alt="logout-logo">
                        <label>Log out from all accounts</label>
                    </div>
                    <button id="log-out-all-button">Log out</button>
                </div>
            </div>

            <div id="delete-account-container">
                    <button onclick="deleteAccountOnClick()" id="delete-account-button"> Delete Account</button>
                    <p id="delete-account-warning">Permanently delete your account and all data.</p>
            </div>
        </div>

        <script src="/js/user-profile/user-profile.js"></script>
        <script src="/js/user-profile/mfa-on-off.js"></script>
        <script src="/js/user-profile/alerts-on-off.js"></script>
    </body>
</html>
