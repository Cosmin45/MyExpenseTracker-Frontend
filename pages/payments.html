<html>
    <head>
        <link rel="stylesheet" href="/css/style.css">
        <title>Payments</title>
    </head>
    <body>
        <div id="payments-top-bar">
            <img src="/images/user-profile-images/back.png" alt="back-img">
            <button onclick="backOnClick()">Back</button>
            <p>Payments</p>
        </div>

        <div id="payments-main-container">
             <div id="payments-add-and-filters-container">
                <button onclick="addPaymentOnClick()" id="payments-add-payment"></button>
                <div id="payments-filters-container">
                    <select name="" id="payment-type-select">
                        <option value="All">All Types</option>
                        <option value="EXPENSE">Expense</option>
                        <option value="INCOME">Income</option>
                    </select>
                    <select name="" id="payment-category-select" onchange="">
                        <option value="All">All Categories</option>
                        <option value="FOOD">Food</option>
                        <option value="TRANSPORT">Transport</option>
                        <option value="ENTERTAINMENT">Entertainment</option>
                        <option value="BILLS">Bills</option>
                        <option value="HEALTH">Health</option>
                        <option value="SHOPPING">Shopping</option>
                        <option value="SALARY">Salary</option>
                        <option value="FREELANCE">Freelance</option>
                        <option value="GROCERIES">Groceries</option>
                        <option value="UTILITIES">Utilities</option>
                        <option value="DINING_OUT">Dining Out</option>
                        <option value="CLOTHING">Clothing</option>
                        <option value="TRANSFER">Transfer</option>
                        <option value="OTHER">Other</option>
                    </select>
                    <select name="" id="payment-time-select">
                        <option value="All">All Time</option>
                        <option value="this-year">This year</option>
                        <option value="last-6-months">Last 6 months</option>
                        <option value="this-month">This Month</option>
                        <option value="last-7-days">Last 7 days</option>
                    </select>
                </div>
             </div>

            <div id="payments-container"></div>
        </div>
        <script src="/js/payments.js"></script>
    </body>
</html>
